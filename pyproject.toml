[project]
name = "comfyui-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0,<3",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "truststore>=0.10.4",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
